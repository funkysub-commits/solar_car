name: EZkontrol CANbus Reader
version: "0.1.0"
slug: ezkontrol_canbus
description: Reads EZkontrol B48800 motor controller telemetry over CAN and pushes sensors to Home Assistant
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
homeassistant_api: true
options:
  can_interface: can0
  can_bitrate: 250000
  push_interval: 2
  dummy_mode: false
schema:
  can_interface: str
  can_bitrate: int(1000,1000000)
  push_interval: int(1,60)
  dummy_mode: bool
