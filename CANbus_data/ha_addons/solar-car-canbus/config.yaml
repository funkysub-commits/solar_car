name: Solar Car CANbus Reader
version: "0.8.0"
slug: solarcar_canbus
description: Reads the EZkontrol motor controller and BESTGO battery from one shared CAN bus (SH-C31G on slcan firmware) and pushes sensors to Home Assistant
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: true
usb: true
uart: true
homeassistant_api: true
options:
  can_port: ""
  can_bitrate: 500000
  ezkontrol_dummy: false
  ezkontrol_push_interval: 2
  bestgo_dummy: false
  bestgo_push_interval: 5
schema:
  can_port: "str?"
  can_bitrate: int(1000,1000000)
  ezkontrol_dummy: bool
  ezkontrol_push_interval: int(1,60)
  bestgo_dummy: bool
  bestgo_push_interval: int(1,60)
