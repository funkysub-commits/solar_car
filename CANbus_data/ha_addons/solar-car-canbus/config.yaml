name: Solar Car CANbus Reader
version: "0.9.2"
slug: solarcar_canbus
description: Reads the EZkontrol motor controller and BESTGO battery from one shared CAN bus (SH-C31G on candlelight/gs_usb firmware, exposed as kernel SocketCAN can0) and pushes sensors to Home Assistant
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
usb: true
uart: true
homeassistant_api: true
options:
  can_bitrate: 500000
  ezkontrol_dummy: false
  ezkontrol_push_interval: 2
  bestgo_dummy: false
  bestgo_push_interval: 5
schema:
  can_bitrate: int(1000,1000000)
  ezkontrol_dummy: bool
  ezkontrol_push_interval: int(1,60)
  bestgo_dummy: bool
  bestgo_push_interval: int(1,60)
