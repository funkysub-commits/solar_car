name: Solar Car CANbus Reader
version: "0.12.0"
slug: solarcar_canbus
description: Reads the EZkontrol motor controller and BESTGO battery from one shared CAN bus (SH-C31G on candlelight/gs_usb firmware, exposed as kernel SocketCAN can0), pushes sensors to Home Assistant, exports any time window of telemetry from HA history as CSV (update interval adjustable live via input_number.canbus_update_interval)
arch:
  - aarch64
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
usb: true
uart: true
homeassistant_api: true
# Export UI (telemetry_export.py) as a sidebar panel; also direct on http://<pi>:8099/
ingress: true
ingress_port: 8099
panel_icon: mdi:download-box
panel_title: Telemetry Export
options:
  can_bitrate: 500000
  ezkontrol_dummy: false
  ezkontrol_push_interval: 2
  bestgo_dummy: false
  bestgo_push_interval: 5
  export_extra_entities: "sensor.solar_car_speed"
schema:
  can_bitrate: int(1000,1000000)
  ezkontrol_dummy: bool
  ezkontrol_push_interval: int(1,60)
  bestgo_dummy: bool
  bestgo_push_interval: int(1,60)
  export_extra_entities: str?
