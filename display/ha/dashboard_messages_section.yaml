# E-Paper Messages dashboard section.
#
# Paste the block below into your dashboard's raw config (the dashboard's
# 3-dot menu > Edit dashboard > 3-dot menu > Raw configuration editor) as a
# new entry in the view's `sections:` list. It needs sensor.eink_warnings
# (published by the add-on) and the scripts from eink_messages.yaml.
#
# It shows every active message (live text, hidden ones marked) and a Hide
# button for each message currently on the e-paper; Unhide all appears when
# anything is hidden.

type: grid
cards:
  - type: heading
    heading: E-Paper Messages
    heading_style: title
    icon: mdi:message-alert
  - type: markdown
    text_only: true
    content: |
      {% set ws = state_attr('sensor.eink_warnings','warnings') %}
      {% if ws %}{% for m in ws %}
      {{ '🔕' if m.hidden else ('ℹ️' if m.icon == 'info' else '⚠️') }} {{ m.text }}{{ ' *(hidden)*' if m.hidden else '' }}
      {% endfor %}{% else %}
      *No active messages*
      {% endif %}
  - type: button
    name: "Hide: CAN bus not connected"
    icon: mdi:eye-off
    show_state: false
    tap_action:
      action: perform-action
      perform_action: script.eink_hide
      data:
        key: can
    visibility:
      - condition: template
        value_template: "{{ 'can' in (state_attr('sensor.eink_warnings','keys_visible') or []) }}"
  - type: button
