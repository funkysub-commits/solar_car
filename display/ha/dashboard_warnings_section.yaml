# E-Paper Warnings dashboard section.
#
# Lists every active warning; for each one a Hide button (while shown) and a
# per-warning Show button (while hidden), plus Unhide all. Button visibility is
# gated on input_text.eink_hidden (instant) AND the warning being active in
# sensor.eink_warnings, so a tap flips the control with no lag and only active
# warnings show controls. Paste this `type: grid` block as a new entry in a
# dashboard view's `sections:` list (Raw configuration editor).

type: grid
cards:
- type: heading
  heading: E-Paper Warnings
  heading_style: title
  icon: mdi:alert
- type: markdown
  text_only: true
  content: '{% set ws = state_attr(''sensor.eink_warnings'',''warnings'') %}

    {% if ws %}{% for m in ws %}

    {{ ''🔕'' if m.hidden else ''⚠️'' }} {{ m.text }}{{ '' *(hidden)*'' if m.hidden else '''' }}

    {% endfor %}{% else %}

    *No active warnings*

    {% endif %}

    '
- type: entities
  title: Send a message to the e-paper
  entities:
  - entity: input_text.eink_message
    name: Message
- type: button
  name: 'Hide: Home Assistant unreachable'
  icon: mdi:eye-off
  show_state: false
  tap_action:
    action: perform-action
    perform_action: script.eink_hide
    data:
      key: ha
  visibility:
  - condition: template
    value_template: '{% set act = (state_attr(''sensor.eink_warnings'',''keys_visible'') or []) + (state_attr(''sensor.eink_warnings'',''keys_hidden'')
      or []) %}{% set hid = states(''input_text.eink_hidden'').split('','') | map(''trim'') | reject(''eq'','''')
      | list %}{{ ''ha'' in act and ''ha'' not in hid }}'
- type: button
  name: 'Show: Home Assistant unreachable'
  icon: mdi:eye
  show_state: false
  tap_action:
    action: perform-action
    perform_action: script.eink_unhide
    data:
      key: ha
  visibility:
  - condition: template
    value_template: '{% set act = (state_attr(''sensor.eink_warnings'',''keys_visible'') or []) + (state_attr(''sensor.eink_warnings'',''keys_hidden'')
      or []) %}{% set hid = states(''input_text.eink_hidden'').split('','') | map(''trim'') | reject(''eq'','''')
      | list %}{{ ''ha'' in act and ''ha'' in hid }}'
