# E-Paper Warnings dashboard section.
#
# Lists every active warning on the e-paper and gives a Hide button for each
# one currently shown; Unhide all appears when anything is hidden. (Plain
# user messages are NOT warnings - set those via input_text.eink_message.)
#
# Paste this `type: grid` block as a new entry in a dashboard view's
# `sections:` list (Raw configuration editor). Needs sensor.eink_warnings
# (published by the add-on) and the scripts from eink_messages.yaml.

type: grid
cards:
  - type: heading
    heading: E-Paper Warnings
    heading_style: title
    icon: mdi:alert
  - type: markdown
    text_only: true
    content: |
      {% set ws = state_attr('sensor.eink_warnings','warnings') %}
      {% if ws %}{% for m in ws %}
      {{ '🔕' if m.hidden else '⚠️' }} {{ m.text }}{{ ' *(hidden)*' if m.hidden else '' }}
      {% endfor %}{% else %}
      *No active warnings*
      {% endif %}
  - type: entities
    title: Send a message to the e-paper
    entities:
      - entity: input_text.eink_message
        name: Message
  - type: button
    name: "Hide: Home Assistant unreachable"
    icon: mdi:eye-off
    show_state: false
    tap_action:
      action: perform-action
      perform_action: script.eink_hide
      data:
        key: ha
    visibility:
      - condition: template
        value_template: "{{ 'ha' in (state_attr('sensor.eink_warnings','keys_visible') or []) }}"
  - type: button
