# Home Assistant package for the e-ink notification / message system.
#
# Enable packages once (in configuration.yaml):
#     homeassistant:
#       packages: !include_dir_named packages
# then drop this file in /config/packages/eink_messages.yaml and restart HA.
#
# What it provides
#   input_text.eink_hidden   - comma-separated list of warning keys the user has
#                              chosen to hide on the e-paper. The add-on reads it
#                              and prunes keys whose warning is no longer active.
#   script.eink_hide         - add a key to the hidden list   (field: key)
#   script.eink_unhide       - remove a key from the hidden list (field: key)
#   script.eink_unhide_all   - clear the hidden list
#   sensor.solar_car_speed   - motor rpm converted to mph. The display add-on
#                              does NO unit conversion (it shows value + unit
#                              exactly as the entity reports them), so this
#                              template sensor is where rpm->mph happens; point
#                              the add-on's ent_speed option at it.
#
# The add-on publishes the live message list to sensor.eink_warnings (created
# automatically once the add-on runs - no need to define it here).

input_text:
  eink_hidden:
    name: EInk Hidden Warnings
    max: 255
    icon: mdi:eye-off

  # The free-text user message shown on the e-paper toast. If you ALREADY created
  # input_text.eink_message as a UI helper (Settings > Devices & Services >
  # Helpers), leave this commented out - defining it here too would be a duplicate
  # entity. If you do NOT have it yet, uncomment this block.
  # eink_message:
  #   name: EInk Message
  #   max: 255
  #   icon: mdi:message-text

script:
  eink_hide:
    alias: EInk Hide Message
    icon: mdi:eye-off
    mode: queued
    max: 10
    fields:
      key:
        description: Warning key to hide (e.g. temp_t_motor, can, user)
        example: temp_t_motor
    sequence:
      - variables:
          parts: >-
            {{ states('input_text.eink_hidden').split(',')
               | map('trim') | reject('eq','') | list }}
      # stop here (no error) if it's already hidden
      - condition: template
        value_template: "{{ key not in parts }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.eink_hidden
        data:
          value: "{{ (parts + [key]) | join(',') }}"

  eink_unhide:
    alias: EInk Unhide Message
    icon: mdi:eye
    mode: queued
    max: 10
    fields:
      key:
        description: Warning key to unhide
        example: temp_t_motor
    sequence:
      - variables:
          parts: >-
            {{ states('input_text.eink_hidden').split(',')
               | map('trim') | reject('eq','') | reject('eq', key) | list }}
      - service: input_text.set_value
        target:
          entity_id: input_text.eink_hidden
        data:
          value: "{{ parts | join(',') }}"

  eink_unhide_all:
    alias: EInk Unhide All
    icon: mdi:eye-check
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.eink_hidden
        data:
          value: ""

# Vehicle speed in mph, derived from the EZkontrol motor rpm. The conversion
# lives HERE (in Home Assistant) by design: the e-ink add-on shows the value
# and unit exactly as its ent_speed entity reports them. Set the add-on's
# ent_speed option to sensor.solar_car_speed to put mph on the gauge. Adjust
# the wheel circumference / gear ratio below to match the drivetrain. With the
# documented values (73.199108 in circumference, 5:1 gear) this works out to
# MPH = rpm * 0.01386347 -- see README section 9.5 for the derivation.
template:
  - sensor:
      - name: "Solar Car Speed"
        unique_id: solar_car_speed_mph
        unit_of_measurement: "mph"
        state_class: measurement
        icon: mdi:speedometer
        availability: >-
          {{ states('sensor.ezkontrol_motor_speed')
             not in ('unknown', 'unavailable', '') }}
        state: >-
          {% set rpm = states('sensor.ezkontrol_motor_speed') | float(0) %}
          {% set wheel_circumference_in = 73.199108 %}
          {% set gear_ratio = 5.0 %}
          {% set wheel_rpm = rpm / gear_ratio %}
          {{ (wheel_rpm * wheel_circumference_in * 60 / 63360) | round(1) }}
