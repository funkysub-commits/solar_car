name: Solar Car E-Ink Display
version: "1.1.0"
slug: solar_epaper
description: Renders a Solar Car telemetry dashboard (speedometer, battery, temperatures) on a Waveshare 7.5" V2 e-ink display
arch:
  - aarch64
startup: services
boot: auto
init: false
full_access: true
homeassistant_api: true
options:
  title: SOLAR STORMS
  speed_unit: mph
  wheel_diameter_in: 20
  gear_ratio: 1
  speed_max: 40
  temp_max: 80
  temp_warn: 65
  speed_poll: 2.5
  slow_poll: 6
  full_refresh_every: 90
  idle_sleep: 180
  ent_speed: sensor.ezkontrol_motor_speed
  ent_t_motor: sensor.ezkontrol_motor_temp
  ent_t_ezk: sensor.ezkontrol_controller_temp
  ent_t_batt: sensor.bestgo_pack_temp
  ent_t_pi: sensor.system_monitor_processor_temperature
  ent_soc: sensor.bestgo_soc
  ent_voltage: sensor.bestgo_pack_voltage
  ent_message: input_text.eink_message
schema:
  title: str
  speed_unit: list(mph|kmh|rpm)
  wheel_diameter_in: float
  gear_ratio: float
  speed_max: float
  temp_max: float
  temp_warn: float
  speed_poll: float
  slow_poll: float
  full_refresh_every: int(1,100000)
  idle_sleep: float
  ent_speed: str
  ent_t_motor: str
  ent_t_ezk: str
  ent_t_batt: str
  ent_t_pi: str
  ent_soc: str
  ent_voltage: str
  ent_message: str
