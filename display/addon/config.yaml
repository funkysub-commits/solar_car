name: Solar Car E-Ink Display
version: "1.7.4"
slug: solar_epaper
description: Renders a Solar Car telemetry dashboard (speedometer, battery, temperatures) on a Waveshare 7.5" V2 e-ink display
arch:
  - aarch64
startup: services
boot: auto
init: false
full_access: true
homeassistant_api: true
hassio_api: true
options:
  title: SOLAR STORMS
  speed_max: 40
  speed_unit: ""
  startup_message: ""
  temp_unit: C
  temp_max: 80
  temp_warn: 65
  speed_poll: 1
  slow_poll: 6
  full_refresh_every: 90
  idle_sleep: 180
  ent_speed: sensor.ezkontrol_motor_speed
  ent_t_motor: sensor.ezkontrol_motor_temp
  ent_t_ezk: sensor.ezkontrol_controller_temp
  ent_t_batt: sensor.bestgo_pack_temp
  ent_t_pi: sensor.system_monitor_processor_temperature
  ent_soc: sensor.bestgo_soc
  ent_voltage: sensor.bestgo_pack_voltage
  ent_message: input_text.eink_message
  ent_charging: binary_sensor.bestgo_charging
  ent_odometer: sensor.odometer
  aux_enabled: true
  ent_aux_soc: sensor.aux_battery_soc
  ent_aux_status: binary_sensor.aux_battery_status
  ent_power: input_boolean.eink_display
  ent_can_bus: sensor.canadapter_status
  ent_can_battery: sensor.bestgo_status
  ent_can_ezkontrol: sensor.ezkontrol_status
schema:
  title: str
  speed_max: float
  speed_unit: str?
  startup_message: str?
  temp_unit: list(C|F)
  temp_max: float
  temp_warn: float
  speed_poll: float(0.2,)
  slow_poll: float(1,)
  full_refresh_every: int(1,100000)
  idle_sleep: float
  ent_speed: str
  ent_t_motor: str
  ent_t_ezk: str
  ent_t_batt: str
  ent_t_pi: str
  ent_soc: str
  ent_voltage: str
  ent_message: str
  ent_charging: str
  ent_odometer: str
  aux_enabled: bool
  ent_aux_soc: str
  ent_aux_status: str
  ent_power: str
  ent_can_bus: str
  ent_can_battery: str
  ent_can_ezkontrol: str
